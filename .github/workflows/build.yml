name: IPA Olustur

on:
  push:
    paths:
      - 'OyunCevirmen/**'
      - 'project.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini olustur
        run: xcodegen generate

      - name: Derle (imzasiz)
        run: |
          xcodebuild \
            -project OyunCevirmen.xcodeproj \
            -target OyunCevirmen \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OyunCevirmen.app Payload/
          zip -qry OyunCevirmen.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OyunCevirmen-ipa
          path: OyunCevirmen.ipa
