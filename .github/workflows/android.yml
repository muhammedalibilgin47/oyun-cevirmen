name: APK Olustur

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Derle
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK hazirla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OyunCevirmen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OyunCevirmen-apk
          path: OyunCevirmen.apk

      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-son --yes --cleanup-tag || true
          gh release create android-son OyunCevirmen.apk --title "Oyun Cevirmen (Android)" --notes "Telefondan indirip kurun."
