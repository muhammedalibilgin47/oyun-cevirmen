name: OyunCevirmen
options:
  bundleIdPrefix: com.mamibey
  deploymentTarget:
    iOS: "15.0"
targets:
  OyunCevirmen:
    type: application
    platform: iOS
    sources:
      - OyunCevirmen
    info:
      path: OyunCevirmen/Info.plist
      properties:
        CFBundleDisplayName: Oyun Çevirmen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Oyundaki konuşmaları duyup Türkçeye çevirmek için mikrofon gerekiyor.
        NSSpeechRecognitionUsageDescription: Oyundaki konuşmaları yazıya dökmek için konuşma tanıma gerekiyor.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamibey.oyuncevirmen
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
